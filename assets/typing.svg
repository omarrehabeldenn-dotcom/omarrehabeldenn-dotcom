<svg xmlns="http://www.w3.org/2000/svg" width="800" height="54" viewBox="0 0 800 54">
<style>
  .t {
    font-family: 'Consolas', 'Monaco', 'Lucida Console', 'Courier New', monospace;
    font-size: 22px;
    font-weight: 700;
  }
  @media (prefers-color-scheme: dark)  { .t, .cur { fill: #a78bfa; } }
  @media (prefers-color-scheme: light) { .t, .cur { fill: #a78bfa; } }
  .cr1 { animation: cl1 20s infinite; }
  .cr2 { animation: cl2 20s infinite; }
  .cr3 { animation: cl3 20s infinite; }
  .cr4 { animation: cl4 20s infinite; }
  .cr5 { animation: cl5 20s infinite; }

  /* Line 1: Software Engineering Student — 28 chars — 369.6px */
  @keyframes cl1 {
    0%        { width: 0;       animation-timing-function: steps(28, end); }
    7%      { width: 369.6px; animation-timing-function: step-end; }
    13%     { width: 369.6px; animation-timing-function: steps(28, end); }
    17%, 100%  { width: 0; }
  }

  /* Line 2: Full-Stack Developer — 20 chars — 264px */
  @keyframes cl2 {
    0%, 19.9%  { width: 0; }
    20%        { width: 0;       animation-timing-function: steps(20, end); }
    27%      { width: 264px; animation-timing-function: step-end; }
    33%     { width: 264px; animation-timing-function: steps(20, end); }
    37%, 100%  { width: 0; }
  }

  /* Line 3: Freelancer — 10 chars — 132px */
  @keyframes cl3 {
    0%, 39.9%  { width: 0; }
    40%        { width: 0;       animation-timing-function: steps(10, end); }
    47%      { width: 132px; animation-timing-function: step-end; }
    53%     { width: 132px; animation-timing-function: steps(10, end); }
    57%, 100%  { width: 0; }
  }

  /* Line 4: Web Application Developer — 27 chars — 356.4px */
  @keyframes cl4 {
    0%, 59.9%  { width: 0; }
    60%        { width: 0;       animation-timing-function: steps(27, end); }
    67%      { width: 356.4px; animation-timing-function: step-end; }
    73%     { width: 356.4px; animation-timing-function: steps(27, end); }
    77%, 100%  { width: 0; }
  }

  /* Line 5: Always Learning & Building — 28 chars — 369.6px */
  @keyframes cl5 {
    0%, 79.9%  { width: 0; }
    80%        { width: 0;       animation-timing-function: steps(28, end); }
    87%      { width: 369.6px; animation-timing-function: step-end; }
    93%     { width: 369.6px; animation-timing-function: steps(28, end); }
    97%, 100%  { width: 0; }
  }

  /* Cursor wrappers — control position and visibility */
  .cw1 { animation: cw1 20s infinite; }
  .cw2 { animation: cw2 20s infinite; }
  .cw3 { animation: cw3 20s infinite; }
  .cw4 { animation: cw4 20s infinite; }
  .cw5 { animation: cw5 20s infinite; }

  @keyframes cw1 {
    0%       { transform: translateX(2px);             visibility: visible; animation-timing-function: steps(28, end); }
    7%     { transform: translateX(371.6px); visibility: visible; animation-timing-function: step-end; }
    13%    { transform: translateX(371.6px); visibility: visible; animation-timing-function: steps(28, end); }
    17%   { transform: translateX(2px);             visibility: visible; }
    19.9%, 100% { visibility: hidden; transform: translateX(2px); }
  }

  @keyframes cw2 {
    0%, 19.9% { visibility: hidden; transform: translateX(2px); }
    20%       { transform: translateX(2px);             visibility: visible; animation-timing-function: steps(20, end); }
    27%     { transform: translateX(266px); visibility: visible; animation-timing-function: step-end; }
    33%    { transform: translateX(266px); visibility: visible; animation-timing-function: steps(20, end); }
    37%   { transform: translateX(2px);             visibility: visible; }
    39.9%, 100% { visibility: hidden; transform: translateX(2px); }
  }

  @keyframes cw3 {
    0%, 39.9% { visibility: hidden; transform: translateX(2px); }
    40%       { transform: translateX(2px);             visibility: visible; animation-timing-function: steps(10, end); }
    47%     { transform: translateX(134px); visibility: visible; animation-timing-function: step-end; }
    53%    { transform: translateX(134px); visibility: visible; animation-timing-function: steps(10, end); }
    57%   { transform: translateX(2px);             visibility: visible; }
    59.9%, 100% { visibility: hidden; transform: translateX(2px); }
  }

  @keyframes cw4 {
    0%, 59.9% { visibility: hidden; transform: translateX(2px); }
    60%       { transform: translateX(2px);             visibility: visible; animation-timing-function: steps(27, end); }
    67%     { transform: translateX(358.4px); visibility: visible; animation-timing-function: step-end; }
    73%    { transform: translateX(358.4px); visibility: visible; animation-timing-function: steps(27, end); }
    77%   { transform: translateX(2px);             visibility: visible; }
    79.9%, 100% { visibility: hidden; transform: translateX(2px); }
  }

  @keyframes cw5 {
    0%, 79.9% { visibility: hidden; transform: translateX(2px); }
    80%       { transform: translateX(2px);             visibility: visible; animation-timing-function: steps(28, end); }
    87%     { transform: translateX(371.6px); visibility: visible; animation-timing-function: step-end; }
    93%    { transform: translateX(371.6px); visibility: visible; animation-timing-function: steps(28, end); }
    97%   { transform: translateX(2px);             visibility: visible; }
    100% { visibility: visible; transform: translateX(2px); }
  }

  /* Cursor blink */
  .cur { animation: blink 1.2s step-end infinite; }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
  }
</style>

<defs>
  <clipPath id="cp1"><rect class="cr1" x="274.6" y="0" width="0" height="54"/></clipPath>
  <clipPath id="cp2"><rect class="cr2" x="254.8" y="0" width="0" height="54"/></clipPath>
  <clipPath id="cp3"><rect class="cr3" x="248.2" y="0" width="0" height="54"/></clipPath>
  <clipPath id="cp4"><rect class="cr4" x="248.2" y="0" width="0" height="54"/></clipPath>
  <clipPath id="cp5"><rect class="cr5" x="248.2" y="0" width="0" height="54"/></clipPath>
</defs>

<!-- Text lines -->
<text class="t" clip-path="url(#cp1)" x="274.6" y="34" textLength="369.6" lengthAdjust="spacingAndGlyphs">Software Engineering Student</text>
<text class="t" clip-path="url(#cp2)" x="254.8" y="34" textLength="264" lengthAdjust="spacingAndGlyphs">Full-Stack Developer</text>
<text class="t" clip-path="url(#cp3)" x="248.2" y="34" textLength="132" lengthAdjust="spacingAndGlyphs">Freelancer</text>
<text class="t" clip-path="url(#cp4)" x="248.2" y="34" textLength="356.4" lengthAdjust="spacingAndGlyphs">Web Application Developer</text>
<text class="t" clip-path="url(#cp5)" x="248.2" y="34" textLength="369.6" lengthAdjust="spacingAndGlyphs">Always Learning &amp; Building</text>

<!-- Cursors -->
<g class="cw1"><rect class="cur" x="274.6" y="16" width="3.5" height="22"/></g>
<g class="cw2"><rect class="cur" x="254.8" y="16" width="3.5" height="22"/></g>
<g class="cw3"><rect class="cur" x="248.2" y="16" width="3.5" height="22"/></g>
<g class="cw4"><rect class="cur" x="248.2" y="16" width="3.5" height="22"/></g>
<g class="cw5"><rect class="cur" x="248.2" y="16" width="3.5" height="22"/></g>

</svg>
